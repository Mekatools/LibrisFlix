<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LibrisFlix - Free & Legal Literature & Classic Cinema</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="brand">
      <img src="logo.png" alt="LibrisFlix Logo" class="brand-logo" onerror="this.style.display='none'" />
      <h1>Libris<span>Flix</span></h1>
    </div>
    <p class="tagline">100% Free & Legal Cinema — From Classic Literature to Screen</p>

    <!-- Search input -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search by title, author, or genre..." />
    </div>

    <!-- Filter Buttons -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="English">English</button>
      <button class="filter-btn" data-filter="Hindi">Hindi (हिंदी)</button>
      <button class="filter-btn" data-filter="literature">📚 Literature Only</button>
    </div>
  </header>

  <main class="container">
    <div id="moviesGrid" class="movies-grid"></div>
  </main>

  <!-- Video Popup Modal -->
  <div id="videoModal" class="modal">
    <div class="modal-box">
      <button class="close-btn" id="closeBtn">&times;</button>
      <h3 id="modalTitle"></h3>
      <div class="video-container">
        <iframe id="videoIframe" src="" frameborder="0" allowfullscreen allow="autoplay"></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
